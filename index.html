<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Vazirmatn', sans-serif; background: #0e0c0a;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px;
  }
  .price-mono { font-family: 'JetBrains Mono', monospace; }
  #phone {
    width: 100%; max-width: 380px; height: 800px; background: #171410;
    border: 8px solid #000; border-radius: 2.2rem; overflow: hidden; position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6); display: flex; flex-direction: column;
  }
  #statusbar { height: 28px; background: #000; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  #statusbar .dot { width: 64px; height: 10px; background: #2a2620; border-radius: 999px; }
  #topbar { background: #171410; color: #EDE6D8; padding: 14px 16px 12px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 8px; border-bottom: 1px solid #2a2620; }
  .icon-btn { width: 36px; height: 36px; border-radius: 999px; background: #221E18; border: 1px solid #332c22; display: flex; align-items: center; justify-content: center; color: #EDE6D8; cursor: pointer; flex-shrink: 0; }
  .icon-btn.active { background: #C97D4A; border-color: #C97D4A; color: #171410; }
  #bodyArea { flex: 1; overflow-y: auto; padding: 18px 16px; background: #171410; }
  #bottomnav { height: 72px; background: #100E0B; border-top: 1px solid #2a2620; display: flex; align-items: center; justify-content: space-around; padding: 0 24px; flex-shrink: 0; }
  .navbtn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: #6f6558; cursor: pointer; font-family: inherit; }
  .navbtn.active { color: #C97D4A; }
  .navbtn span { font-size: 10px; }
  #addBtn { width: 50px; height: 50px; border-radius: 999px; background: #C97D4A; border: none; display: flex; align-items: center; justify-content: center; margin-top: -26px; box-shadow: 0 8px 20px rgba(201,125,74,0.45); cursor: pointer; }

  .eyebrow { font-size: 10px; letter-spacing: .22em; color: #C97D4A; font-weight: 700; }

  /* voice hero */
  .voice-hero { display: flex; flex-direction: column; align-items: center; padding: 18px 0 8px; }
  .rings { position: relative; width: 128px; height: 128px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(201,125,74,0.35); }
  .ring.r1 { width: 128px; height: 128px; }
  .ring.r2 { width: 100px; height: 100px; border-color: rgba(201,125,74,0.5); }
  .ring.r3 { width: 72px; height: 72px; border-color: rgba(201,125,74,0.7); }
  .ring.pulse { animation: pulse 2.6s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.9; } 100% { transform: scale(1.35); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ring.pulse { animation: none; } }
  #micBtn { position: relative; z-index: 2; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(160deg,#C97D4A,#A3612F); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 18px rgba(201,125,74,0.4); }
  #micBtn.listening { box-shadow: 0 0 0 6px rgba(201,125,74,0.25); }
  .voice-hint { font-size: 11px; color: #857a69; margin-top: 2px; }

  .text-search { width: 100%; background: #221E18; border: 1px solid #332c22; border-radius: 14px; display: flex; align-items: center; padding: 10px 14px; gap: 8px; margin: 14px 0 16px; }
  .text-search input { background: transparent; border: none; outline: none; color: #EDE6D8; font-family: inherit; font-size: 13px; flex: 1; }
  .text-search input::placeholder { color: #6f6558; }

  .stats-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .stat-chip { flex: 1; background: #1E1A15; border: 1px solid #2a2620; border-radius: 14px; padding: 10px; text-align: center; }
  .stat-chip .n { font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; color: #C97D4A; }
  .stat-chip .l { font-size: 9.5px; color: #857a69; margin-top: 2px; }

  .section-label { font-size: 11.5px; color: #857a69; font-weight: 600; margin: 4px 0 10px; display: flex; align-items: center; justify-content: space-between; }

  .card { width: 100%; background: #1E1A15; border: 1px solid #2a2620; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px; border: none; text-align: right; cursor: pointer; margin-bottom: 10px; font-family: inherit; }
  .card:active { transform: scale(0.98); }
  .swatch { width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .grow { flex: 1; min-width: 0; }
  .title-sm { font-weight: 600; color: #EDE6D8; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub-sm { font-size: 11px; color: #857a69; display: flex; align-items: center; gap: 4px; white-space: normal; word-break: break-word; }
  .badge { font-size: 11px; background: rgba(201,125,74,0.15); color: #C97D4A; border-radius: 999px; padding: 4px 8px; font-weight: 600; flex-shrink: 0; }
  .empty { text-align: center; margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #857a69; }
  .empty .ic { width: 56px; height: 56px; border-radius: 16px; background: #1E1A15; border: 1px solid #2a2620; display: flex; align-items: center; justify-content: center; }
  .empty .t { font-weight: 600; color: #EDE6D8; font-size: 13px; margin-top: 4px; }
  .empty .d { font-size: 12px; max-width: 220px; }

  .prodrow { background: #1E1A15; border: 1px solid #2a2620; border-radius: 16px; padding: 12px; display: flex; gap: 12px; margin-bottom: 10px; }
  .prodrow.inactive { opacity: 0.45; }
  .thumb { width: 56px; height: 56px; border-radius: 12px; flex-shrink: 0; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .price-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .price-val { font-size: 14px; font-weight: 700; color: #C97D4A; }
  .unit-lbl { font-size: 10px; color: #857a69; }
  .check-lbl { font-size: 11px; color: #8FB39A; font-weight: 600; margin-top: 2px; }
  .hist-link { font-size: 10px; color: #8FB39A; display: flex; align-items: center; gap: 2px; margin-right: auto; background: none; border: none; cursor: pointer; font-family: inherit; }
  .actions-col { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .mini-btn { width: 28px; height: 28px; border-radius: 8px; background: #262119; border: 1px solid #332c22; display: flex; align-items: center; justify-content: center; cursor: pointer; }

  .toggle-link { font-size: 11px; color: #857a69; display: flex; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; font-family: inherit; }
  .factory-toprow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .call-link { font-size: 11px; color: #C97D4A; font-weight: 600; display: flex; align-items: center; gap: 4px; text-decoration: none; }

  #searchBox { flex: 1; background: #221E18; border: 1px solid #332c22; border-radius: 12px; display: flex; align-items: center; padding: 8px 12px; gap: 8px; }
  #searchInput { background: transparent; border: none; outline: none; color: #EDE6D8; font-family: inherit; font-size: 13px; flex: 1; }
  #searchInput::placeholder { color: #6f6558; }

  .filter-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-chip { font-size: 11px; background: #1E1A15; border: 1px solid #2a2620; color: #857a69; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-family: inherit; }
  .filter-chip.active { background: #C97D4A; border-color: #C97D4A; color: #171410; font-weight: 600; }

  #modalRoot { position: absolute; inset: 0; z-index: 30; display: none; }
  #lightboxRoot { position: absolute; inset: 0; z-index: 60; display: none; }
  #loginRoot { position: absolute; inset: 0; z-index: 80; background: #171410; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-end; }
  .modal-sheet { background: #1E1A15; border-top: 1px solid #332c22; width: 100%; border-radius: 24px 24px 0 0; padding: 20px; max-height: 92%; overflow-y: auto; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-head .t { font-weight: 700; color: #EDE6D8; }
  .modal-head button { background: none; border: none; cursor: pointer; color: #EDE6D8; }
  .field { margin-bottom: 12px; }
  .field label { font-size: 11px; color: #857a69; display: block; margin-bottom: 4px; }
  .field input, .field textarea, .field select { width: 100%; background: #262119; border: 1px solid #332c22; color: #EDE6D8; border-radius: 12px; padding: 9px 12px; font-size: 13px; font-family: inherit; outline: none; resize: none; }
  .field input::placeholder, .field textarea::placeholder { color: #6f6558; }
  .field input:focus, .field textarea:focus, .field select:focus { box-shadow: 0 0 0 2px rgba(201,125,74,0.4); }
  .attr-filter-wrap { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .row2 { display: flex; gap: 8px; align-items: flex-end; }
  .row2 > .field { flex: 1; }
  .save-btn { width: 100%; background: #C97D4A; color: #171410; border: none; border-radius: 12px; padding: 13px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; margin-top: 4px; }
  .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .photo-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .photo-thumb-item { position: relative; width: 72px; height: 72px; border-radius: 12px; overflow: hidden; flex-shrink: 0; }
  .photo-thumb-item img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
  .photo-remove-btn { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,0.6); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .photo-add-tile { width: 72px; height: 72px; border-radius: 12px; border: 2px dashed #332c22; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; color: #857a69; flex-shrink: 0; }
  .photo-add-tile input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .photo-count-badge { position: absolute; bottom: 3px; left: 3px; background: rgba(0,0,0,0.65); color: #EDE6D8; font-size: 9px; font-weight: 700; border-radius: 999px; padding: 1px 5px; }
  .detail-gallery { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; }
  .detail-gallery-img { height: 150px; border-radius: 14px; object-fit: cover; flex-shrink: 0; cursor: pointer; }
  .lightbox-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 60; }
  .lightbox-overlay img { max-width: 100%; max-height: 100%; border-radius: 12px; object-fit: contain; }
  .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.15); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .lightbox-nav.lightbox-prev { right: 16px; }
  .lightbox-nav.lightbox-next { left: 16px; }
  .lightbox-close { position: absolute; top: 16px; left: 16px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.15); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .lightbox-counter { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.5); color: #fff; font-size: 11px; padding: 4px 10px; border-radius: 999px; }
  .rating-badge { font-size: 10px; font-weight: 700; border-radius: 999px; padding: 3px 9px; border: 1px solid; white-space: nowrap; flex-shrink: 0; }

  #toast { position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%); background: #C97D4A; color: #171410; font-size: 12px; font-weight: 600; padding: 9px 16px; border-radius: 999px; box-shadow: 0 6px 16px rgba(0,0,0,0.4); display: none; z-index: 40; }

  .hist-cur { display: flex; align-items: center; justify-content: space-between; background: rgba(201,125,74,0.15); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .hist-old { display: flex; align-items: center; justify-content: space-between; background: #262119; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chip { border: 1px solid #332c22; background: #262119; color: #EDE6D8; font-family: inherit; font-size: 11.5px; padding: 6px 11px; border-radius: 999px; cursor: pointer; }
  .chip.selected { background: #C97D4A; border-color: #C97D4A; color: #171410; }
  .custom-chip-input { width: 100%; background: #262119; color: #EDE6D8; border: 1px dashed #332c22; border-radius: 999px; padding: 7px 12px; font-size: 11.5px; font-family: inherit; outline: none; margin-bottom: 2px; }
  .custom-chip-input::placeholder { color: #6f6558; }
  .custom-chip-input:focus { box-shadow: 0 0 0 2px rgba(201,125,74,0.3); }
  .tag-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .tag-pill { font-size: 9.5px; background: #262119; color: #857a69; border: 1px solid #332c22; border-radius: 999px; padding: 2px 7px; }
  .entry-card { border: 1px solid #2a2620; border-radius: 16px; padding: 14px; margin-bottom: 14px; background: #1a1712; }
</style>
</head>
<body>
<div id="phone">
  <div id="statusbar"><div class="dot"></div></div>
  <div id="topbar"></div>
  <div id="bodyArea"></div>
  <div id="bottomnav"></div>
  <div id="modalRoot"></div>
  <div id="lightboxRoot"></div>
  <div id="loginRoot"></div>
  <div id="toast"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// ---------- Firestore config & collection names ----------
const COL_FACTORIES = 'factories';
const COL_PRODUCTS = 'products';
const COL_PRODUCT_PHOTOS = 'productPhotos';
const firebaseConfig = {
  apiKey: "AIzaSyC4_bJsF23BwxVSI3ChKr1tpZr-bn56_1o",
  authDomain: "ai-stone-5eb7f.firebaseapp.com",
  projectId: "ai-stone-5eb7f",
  storageBucket: "ai-stone-5eb7f.firebasestorage.app",
  messagingSenderId: "585895645803",
  appId: "1:585895645803:web:9555a0b182e4b2b5db172e"
};
let db = null;
let factoriesLoadedOnce = false;
let productsLoadedOnce = false;

// ---------- state ----------
let factories = [];
let products = [];
let loaded = false;
let view = 'home';
let activeFactoryId = null;
let showInactive = false;
let searchQuery = '';
let listening = false;
let sortMode = 'newest'; // newest | cheapest | alpha
let showPriceFilter = false;
let priceMin = '';
let priceMax = '';
let showAttrFilter = false;
let filterStoneType = '';
let filterColor = '';
let filterPattern = '';
let filterSort = '';
let filterProcess = '';
let filterDimType = '';
let activeProductId = null;
let factoriesSearchQuery = '';
let scrollPositions = {};
let searchModeFactory = false;
let productDetailFrom = 'search';

let factoryModalData = null;
let productModalData = null;
let historyModalProduct = null;

let productEntries = []; // هر آیتم: عکس + مشخصات مخصوص به خودش
const STONE_TYPE_OPTIONS = ['تراورتن', 'مرمریت', 'ترامیت', 'لایمستون', 'گرانیت', 'چینی'];
const COLOR_OPTIONS = ['سفید', 'کرم', 'عسلی', 'شکلاتی', 'نسکافه‌ای', 'مشکی', 'طوسی', 'سبز'];
const PATTERN_OPTIONS = ['بی‌موج', 'موج‌دار', 'بی‌دنده', 'خط‌دار', 'بی‌خط', 'ابر و بادی', 'رگه‌دار'];
const SORT_OPTIONS = ['سوپر', 'ممتاز', 'درجه یک', 'درجه دو', 'پشت‌کاری'];
const PROCESS_OPTIONS = ['سابیده', 'چرمی', 'پولیش', 'تیشه‌ای', 'بوشهامر', 'خام'];
const DIM_TYPES = ['تایل', 'اسلب', 'سنگ پله', 'سنگ فرشی', 'صادراتی', 'صراحی'];
const TILE_WIDTHS = ['30', '40', '60'];
const THICKNESS_OPTIONS = ['1.6', '1.7', '1.8', '2', '3'];
const SPOUT_SHAPES = ['گرد', 'چهارگوش'];

// ---------- helpers ----------
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = (iso) => { try { return new Date(iso).toLocaleDateString('fa-IR', { year: 'numeric', month: 'short', day: 'numeric' }); } catch (e) { return iso; } };
const fmtNum = (n) => Number(n || 0).toLocaleString('en-US');
const esc = (s) => (s === null || s === undefined ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function formatThousands(value) {
  const digits = String(value === null || value === undefined ? '' : value).replace(/[^\d]/g, '');
  if (!digits) return '';
  return Number(digits).toLocaleString('en-US').replace(/,/g, '.');
}

function attachPriceFormatting(inputId) {
  const el = document.getElementById(inputId);
  if (!el) return;
  el.addEventListener('input', () => {
    const digits = el.value.replace(/[^\d]/g, '');
    el.value = digits ? Number(digits).toLocaleString('en-US').replace(/,/g, '.') : '';
  });
}

function isPriceExpired(p) {
  const days = Number(p.priceValidityDays);
  if (!days) return false;
  const base = new Date(p.lastPriceDate);
  base.setDate(base.getDate() + days);
  return new Date() > base;
}

function chipGroupHTML(field, options, selected, entryId) {
  const isCustom = selected && !options.includes(selected);
  const chips = options.map(o => `<button type="button" class="chip ${o === selected ? 'selected' : ''}" data-action="selectChip" data-field="${field}" data-value="${esc(o)}" data-entry="${entryId}">${esc(o)}</button>`).join('');
  return `<div class="chip-row" id="${field}Chips_${entryId}">${chips}</div>
    <input class="custom-chip-input" id="p_custom_${field}_${entryId}" placeholder="یا مورد جدید بنویس..." value="${isCustom ? esc(selected) : ''}">`;
}

function renderDimDetail(entryId, dimType, existing) {
  const el = document.getElementById('dimDetail_' + entryId);
  if (!el) return;
  existing = existing || {};
  if (!dimType) {
    el.innerHTML = `<div style="font-size:11px;color:#857a69;margin-top:2px;">یک نوع رو انتخاب کن</div>`;
    return;
  }
  if (dimType === 'صراحی') {
    el.innerHTML = `
      <div class="field" style="margin-top:8px;"><label>طول (سانتی‌متر)</label><input id="dim_spoutLength_${entryId}" type="number" value="${esc(existing.spoutLength || '')}" placeholder="مثلاً 90"></div>
      <div style="font-size:10.5px;color:#857a69;margin-bottom:4px;">گرد یا چهارگوش</div>
      <div class="chip-row" id="spoutShapeChips_${entryId}">${SPOUT_SHAPES.map(s => `<button type="button" class="chip ${s === existing.spoutShape ? 'selected' : ''}" data-action="selectSpoutShape" data-value="${esc(s)}" data-entry="${entryId}">${esc(s)}</button>`).join('')}</div>`;
    return;
  }
  let html = '';
  if (dimType === 'تایل') {
    html += `<div style="font-size:10.5px;color:#857a69;margin:6px 0 4px;">عرض (سانتی‌متر) — طول آزاد است</div>
      ${chipGroupHTML('width', TILE_WIDTHS, existing.width, entryId)}`;
  } else {
    html += `<div class="row2" style="margin-top:6px;">
      <div class="field" style="margin-bottom:0;"><label>عرض (سانتی‌متر)</label><input id="dim_width_input_${entryId}" type="number" value="${esc(existing.width || '')}" placeholder="مثلاً 90"></div>
      <div class="field" style="margin-bottom:0;"><label>طول (سانتی‌متر)</label><input id="dim_length_input_${entryId}" type="number" value="${esc(existing.length || '')}" placeholder="مثلاً 200"></div>
    </div>`;
  }
  html += `<div style="font-size:10.5px;color:#857a69;margin:10px 0 4px;">ضخامت (سانتی‌متر)</div>
    ${chipGroupHTML('thickness', THICKNESS_OPTIONS, existing.thickness, entryId)}`;
  el.innerHTML = html;

  if (dimType === 'تایل') {
    const input = document.getElementById('p_custom_width_' + entryId);
    if (input) input.addEventListener('input', () => {
      document.getElementById('widthChips_' + entryId).querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      const entry = productEntries.find(e => e.localId === entryId);
      if (entry) entry.width = null;
    });
  }
  const thicknessInput = document.getElementById('p_custom_thickness_' + entryId);
  if (thicknessInput) thicknessInput.addEventListener('input', () => {
    document.getElementById('thicknessChips_' + entryId).querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    const entry = productEntries.find(e => e.localId === entryId);
    if (entry) entry.thickness = null;
  });
}

const fullPhotosCache = {};
let pendingLightboxRequest = null;
function getProductPhotos(p) {
  // legacy records (saved before this change) already carry full photos inline — no fetch needed
  if (p.photos && p.photos.length) return p.photos;
  if (p.photo) return [p.photo];
  // newer records: full photos live in a separate collection, fetched only when actually needed
  if (fullPhotosCache[p.id]) return fullPhotosCache[p.id];
  if (fullPhotosCache[p.id] === undefined) {
    fullPhotosCache[p.id] = null;
    db.collection(COL_PRODUCT_PHOTOS).doc(p.id).get().then((doc) => {
      fullPhotosCache[p.id] = (doc.exists && doc.data().photos) ? doc.data().photos : [];
      if (pendingLightboxRequest && pendingLightboxRequest.productId === p.id) {
        const req = pendingLightboxRequest;
        pendingLightboxRequest = null;
        if (fullPhotosCache[p.id].length) openLightbox(fullPhotosCache[p.id], req.idx);
      }
      render();
    }).catch(() => { fullPhotosCache[p.id] = []; });
  }
  return [];
}

function getProductPhotoThumbs(p) {
  if (p.photoThumbs && p.photoThumbs.length) return p.photoThumbs;
  if (p.photos && p.photos.length) return p.photos;
  if (p.photo) return [p.photo];
  return [];
}

function getProductPhotoCount(p) {
  if (typeof p.photoCount === 'number') return p.photoCount;
  if (p.photos && p.photos.length) return p.photos.length;
  if (p.photo) return 1;
  return 0;
}

function resolvePhotoSrc(photoRef) {
  return photoRef || '';
}

const RATING_COLORS = {
  'خیلی ضعیف': '#D14343',
  'ضعیف': '#D08C74',
  'متوسط': '#C9A227',
  'خوب': '#8FB39A',
  'بسیار خوب': '#5FA776'
};
function factoryRatingScore(f) {
  if (!f) return null;
  const vals = [f.ratingCut, f.ratingSab, f.ratingSort, f.ratingBehavior];
  if (vals.some(v => v === undefined || v === null || v === '')) return null;
  const [cut, sab, sort, behavior] = vals.map(Number);
  if ([cut, sab, sort, behavior].some(v => isNaN(v))) return null;
  return (cut * 1 + sab * 1 + sort * 2 + behavior * 2) / 6;
}
function factoryRatingLabel(score) {
  if (score < 2) return 'خیلی ضعیف';
  if (score < 4) return 'ضعیف';
  if (score < 6) return 'متوسط';
  if (score < 8) return 'خوب';
  return 'بسیار خوب';
}
function factoryRatingBadgeHTML(f) {
  const score = factoryRatingScore(f);
  if (score === null) return '';
  const label = factoryRatingLabel(score);
  const color = RATING_COLORS[label] || '#857a69';
  return `<span class="rating-badge" style="background:${color}22;color:${color};border-color:${color}66;">${score.toFixed(1)} · ${label}</span>`;
}

function productThumbHTML(p, cls) {
  const thumbs = getProductPhotoThumbs(p);
  const count = getProductPhotoCount(p);
  if (!thumbs.length) {
    return `<div class="${cls}" style="position:relative;background:${swatchFor(p.stoneType||p.name)}"></div>`;
  }
  return `<div class="${cls}" data-action="openLightbox" data-id="${p.id}" data-idx="0" style="position:relative;cursor:pointer;">
    <img src="${resolvePhotoSrc(thumbs[0])}" style="width:100%;height:100%;object-fit:cover;">
    ${count > 1 ? `<span class="photo-count-badge">+${count - 1}</span>` : ''}
  </div>`;
}

function swatchFor(name) {
  name = name || '';
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  const hues = [[28,45,42],[150,20,32],[20,45,38],[40,35,45],[200,15,38]];
  const [h,s,l] = hues[hash % hues.length];
  const h2 = (h + 18 + (hash % 20)) % 360;
  return `linear-gradient(135deg, hsl(${h} ${s}% ${l}%) 0%, hsl(${h2} ${s+10}% ${l+10}%) 100%)`;
}

    case 'eye': return wrap(`<path d="M2 12c1-3 5-7 10-7s9 4 10 7c-1 3-5 7-10 7s-9-4-10-7z"/><circle cx="12" cy="12" r="3"/>`);
    case 'camera': return wrap(`<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l1.5-3h5L16 7"/><circle cx="12" cy="13.5" r="3.5"/>`);

function saveProductSingle(data) {
  const photosFull = data.photos || [];
  const photoThumbs = data.photoThumbs || [];
  const photoCount = photosFull.length;

  if (data.id) {
    const existing = products.find(p => p.id === data.id) || {};
    const priceChanged = Number(data.priceCash) !== Number(existing.priceCash) || Number(data.priceCheck || 0) !== Number(existing.priceCheck || 0);
    const priceHistory = existing.priceHistory || [];
    const newHistory = priceChanged ? [...priceHistory, { priceCash: existing.priceCash || 0, priceCheck: existing.priceCheck || '', checkMonths: existing.checkMonths || '', date: existing.lastPriceDate || existing.createdAt }] : priceHistory;
    const payload = Object.assign({}, data, { priceHistory: newHistory, lastPriceDate: priceChanged ? todayISO() : existing.lastPriceDate, photoThumbs, photoCount });
    delete payload.id;
    delete payload.photos;
    db.collection(COL_PRODUCTS).doc(data.id).update(payload).catch(() => showToast('ذخیره‌سازی ناموفق بود'));
    db.collection(COL_PRODUCT_PHOTOS).doc(data.id).set({ photos: photosFull }).then(() => {
      fullPhotosCache[data.id] = photosFull;
    }).catch(() => {});
  } else {
    const docRef = db.collection(COL_PRODUCTS).doc();
    const payload = {
      factoryId: data.factoryId, name: data.name, stoneType: data.stoneType||'',
      color: data.color||'', pattern: data.pattern||'', processType: data.processType||'',
      sort: data.sort||'', qadopa: data.qadopa||'',
      dimensionType: data.dimensionType||'', width: data.width||'', length: data.length||'', thickness: data.thickness||'',
      spoutLength: data.spoutLength||'', spoutShape: data.spoutShape||'',
      unit: data.unit||'م.م', priceCash: data.priceCash||0, priceCheck: data.priceCheck||'', checkMonths: data.checkMonths||'',
      priceValidityDays: data.priceValidityDays||'',
      photoThumbs, photoCount, notes: data.notes||'',
      active: true, createdAt: todayISO(), lastPriceDate: todayISO(), priceHistory: []
    };
    docRef.set(payload).catch(() => showToast('ذخیره‌سازی ناموفق بود'));
    db.collection(COL_PRODUCT_PHOTOS).doc(docRef.id).set({ photos: photosFull }).then(() => {
      fullPhotosCache[docRef.id] = photosFull;
    }).catch(() => {});
  }
}

function handlePhotoFile(file, cb) {
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 480;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.6);

      const thumbW = 64;
      const thumbScale = Math.min(1, thumbW / img.width);
      const tCanvas = document.createElement('canvas');
      tCanvas.width = Math.round(img.width * thumbScale);
      tCanvas.height = Math.round(img.height * thumbScale);
      const tCtx = tCanvas.getContext('2d');
      tCtx.drawImage(img, 0, 0, tCanvas.width, tCanvas.height);
      const thumbUrl = tCanvas.toDataURL('image/jpeg', 0.4);

      cb(dataUrl, thumbUrl);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function startVoice(targetInputId) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('جستجوی صوتی پشتیبانی نمی‌شود'); return; }
  const rec = new SR();
  rec.lang = 'fa-IR';
  rec.onstart = () => { listening = true; render(); };
  rec.onresult = (e) => {
    const text = e.results[0][0].transcript;
    if (targetInputId === 'searchInput') { searchQuery = text; view = 'search'; render(); }
    else { const el = document.getElementById(targetInputId); if (el) { el.value = text; el.dispatchEvent(new Event('input')); } }
  };
  rec.onerror = () => { listening = false; render(); };
  rec.onend = () => { listening = false; render(); };
  rec.start();
}

let activeRecognition = null;
function startVoiceRecording(targetInputId) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('جستجوی صوتی پشتیبانی نمی‌شود'); return; }
  if (activeRecognition) return;
  const rec = new SR();
  rec.lang = 'fa-IR';
  activeRecognition = rec;
  rec.onstart = () => { listening = true; render(); };
  rec.onresult = (e) => {
    const text = e.results[0][0].transcript;
    if (targetInputId === 'searchInput') { searchQuery = text; view = 'search'; render(); }
    else { const el = document.getElementById(targetInputId); if (el) { el.value = text; el.dispatchEvent(new Event('input')); } }
  };
  rec.onerror = () => { listening = false; activeRecognition = null; render(); };
  rec.onend = () => { listening = false; activeRecognition = null; render(); };
  rec.start();
}
function stopVoiceRecording() {
  if (activeRecognition) { try { activeRecognition.stop(); } catch (e) {} }
}

      html += `<div class="sub-sm" style="margin-bottom:10px;">${esc(p.stoneType)}</div>`;
      if (p.color || p.pattern || p.processType || p.sort || p.dimensionType || p.thickness || p.qadopa) {
        html += `<div class="tag-row" style="margin-bottom:12px;">
          ${[p.color,p.pattern,p.processType,p.sort].filter(Boolean).map(x => `<span class="tag-pill">${esc(x)}</span>`).join('')}
          ${p.qadopa ? `<span class="tag-pill">قد و پا: ${esc(p.qadopa)}</span>` : ''}

        <span class="unit-lbl">· ${fmtDate(p.lastPriceDate)}</span>

        ${p.priceHistory && p.priceHistory.length > 0 ? `<button class="hist-link" data-action="showHistory" data-id="${p.id}">${icon('history',11)} تاریخچه</button>` : ''}
      </div>`;
      if (p.priceCheck) html += `<div class="check-lbl" style="margin-bottom:10px;">چک${p.checkMonths ? ' ' + esc(p.checkMonths) + ' ماهه' : ''}: ${fmtNum(p.priceCheck)} تومان</div>`;

      html += `<div class="card" style="margin-top:16px;cursor:default;">

        </div>

        html += `<a href="tel:${esc(f.phone)}" class="save-btn" style="display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;">

  else if (view === 'search') {

      <button class="filter-chip ${sortMode==='cheapest'?'active':''}" data-action="setSort" data-sort="cheapest">ارزان‌ترین</button>
      <button class="filter-chip ${sortMode==='alpha'?'active':''}" data-action="setSort" data-sort="alpha">الفبا</button>
      <button class="filter-chip ${showPriceFilter?'active':''}" data-action="togglePriceFilter">بازه قیمت</button>
      <button class="filter-chip ${showAttrFilter?'active':''}" data-action="toggleAttrFilter">فیلترهای دقیق</button>

      <div class="field" style="margin-bottom:0;"><label>حداکثر قیمت (تومان)</label><input id="priceMaxInput" value="${formatThousands(priceMax)}" inputmode="numeric" placeholder="مثلاً 1.500.000"></div>

    if (showPriceFilter) {
      const minEl = document.getElementById('priceMinInput');
      const maxEl = document.getElementById('priceMaxInput');
      attachPriceFormatting('priceMinInput');
      attachPriceFormatting('priceMaxInput');
      if (minEl) minEl.addEventListener('input', (e) => { priceMin = e.target.value.replace(/\./g, ''); renderSearchResultsOnly(); });
      if (maxEl) maxEl.addEventListener('input', (e) => { priceMax = e.target.value.replace(/\./g, ''); renderSearchResultsOnly(); });

      [['attrStoneType','stoneType'],['attrColor','color'],['attrPattern','pattern'],['attrSort','sort'],['attrProcess','process'],['attrDimType','dimType']].forEach(([elId, key]) => {
        const sel = document.getElementById(elId);
        if (sel) sel.addEventListener('change', (e) => {
          if (key === 'stoneType') filterStoneType = e.target.value;
          else if (key === 'color') filterColor = e.target.value;
          else if (key === 'pattern') filterPattern = e.target.value;
          else if (key === 'sort') filterSort = e.target.value;

function distinctValues(field) {
  const vals = products.map(p => p[field]).filter(Boolean);
  return Array.from(new Set(vals));
}

function attrFilterHTML() {
  const selectRow = (id, label, options, selected) => `
    <div class="field" style="margin-bottom:0;">
      <label>${label}</label>
      <select id="${id}">
        <option value="">همه</option>
        ${options.map(o => `<option value="${esc(o)}" ${o === selected ? 'selected' : ''}>${esc(o)}</option>`).join('')}
      </select>
    </div>`;
  return `<div class="attr-filter-wrap">
    <div class="row2">${selectRow('attrStoneType','نوع سنگ', distinctValues('stoneType'), filterStoneType)}${selectRow('attrColor','رنگ', distinctValues('color'), filterColor)}</div>
    <div class="row2">${selectRow('attrPattern','طرح سنگ', distinctValues('pattern'), filterPattern)}${selectRow('attrSort','سورت سنگ', distinctValues('sort'), filterSort)}</div>
    <div class="row2">${selectRow('attrProcess','نوع فرآوری', distinctValues('processType'), filterProcess)}${selectRow('attrDimType','ابعاد و نوع محصول', DIM_TYPES, filterDimType)}</div>
  </div>`;
}

function productSearchText(p, f) {
  return [p.name, p.stoneType, p.color, p.pattern, p.sort, p.processType, p.dimensionType, p.qadopa, p.unit, p.notes,
    f ? f.name : '', f ? f.location : '', f ? f.contactName : '', f ? f.contactTitle : '']
    .filter(Boolean).join(' ').toLowerCase();
}

function renderSearchResultsOnly() {
  const wrap = document.getElementById('searchResultsWrap');
  if (!wrap) return;
  const q = searchQuery.trim().toLowerCase();
  const tokens = q.split(/\s+/).filter(Boolean);
  let results = products.map(p => ({ p, f: factories.find(f => f.id === p.factoryId) }));
  if (tokens.length) {
    results = results.filter(({p,f}) => {
      const text = productSearchText(p, f);
      return tokens.every(tok => text.includes(tok));
    });
  }
  if (filterStoneType) results = results.filter(({p}) => p.stoneType === filterStoneType);
  if (filterColor) results = results.filter(({p}) => p.color === filterColor);
  if (filterPattern) results = results.filter(({p}) => p.pattern === filterPattern);
  if (filterSort) results = results.filter(({p}) => p.sort === filterSort);
  if (filterProcess) results = results.filter(({p}) => p.processType === filterProcess);
  if (filterDimType) results = results.filter(({p}) => p.dimensionType === filterDimType);
  if (priceMin !== '') results = results.filter(({p}) => Number(p.priceCash) >= Number(priceMin));
  if (priceMax !== '') results = results.filter(({p}) => Number(p.priceCash) <= Number(priceMax));
  if (sortMode === 'cheapest') results.sort((a,b) => a.p.priceCash - b.p.priceCash);
  else if (sortMode === 'alpha') results.sort((a,b) => a.p.name.localeCompare(b.p.name, 'fa'));
  else results.sort((a,b) => b.p.lastPriceDate.localeCompare(a.p.lastPriceDate));
  const hasAnyFilter = tokens.length || filterStoneType || filterColor || filterPattern || filterSort || filterProcess || filterDimType || priceMin !== '' || priceMax !== '';
  if (!hasAnyFilter) { wrap.innerHTML = `<div style="text-align:center;color:#857a69;font-size:12px;margin-top:24px;">نام سنگ، هر مشخصه (نوع، رنگ، طرح، سورت، فرآوری، ابعاد) یا نام/منطقهٔ کارخانه رو بنویس، یا با میکروفون بگو</div>`; return; }
  if (searchModeFactory) {
    const seen = {};
    const factoryList = [];
    results.forEach(({f}) => { if (f && !seen[f.id]) { seen[f.id] = true; factoryList.push(f); } });
    if (factoryList.length === 0) { wrap.innerHTML = emptyState('search', 'کارخانه‌ای پیدا نشد', 'عبارت یا فیلتر دیگه‌ای رو امتحان کن.'); return; }
    wrap.innerHTML = factoryList.map(f => `
      <button class="card" data-action="openFactoryFromSearch" data-id="${f.id}">
        <div class="swatch" style="background:${swatchFor(f.name)}">${icon('factory',18,'rgba(255,255,255,0.9)')}</div>
        <div class="grow">
          <div class="title-sm">${esc(f.name)}</div>
          <div class="sub-sm">${icon('mapPin',11)} ${esc(f.location) || 'بدون آدرس'}</div>
          ${factoryRatingBadgeHTML(f) ? `<div style="margin-top:4px;">${factoryRatingBadgeHTML(f)}</div>` : ''}
          ${f.phone ? `<div class="sub-sm">${icon('phone',10)} ${esc(f.phone)}${f.contactName ? ' · ' + esc(f.contactName) : ''}</div>` : ''}
        </div>
        ${icon('chevronLeft',16,'#6f6558')}
      </button>`).join('');
    return;
  }
  if (results.length === 0) { wrap.innerHTML = emptyState('search', 'چیزی پیدا نشد', 'عبارت یا فیلتر دیگه‌ای رو امتحان کن.'); return; }
  wrap.innerHTML = results.map(({p,f}) => `
    <button class="card" data-action="openProductDetail" data-id="${p.id}">
      ${productThumbHTML(p, 'thumb swatch')}
      <div class="grow">
        <div class="title-sm">${esc(p.name)}</div>
        <div class="sub-sm">${esc(f ? f.name : '')} · ${esc(f ? f.location : '')}</div>
        ${f && factoryRatingBadgeHTML(f) ? `<div style="margin:3px 0;">${factoryRatingBadgeHTML(f)}</div>` : ''}
        ${f && f.phone ? `<div class="sub-sm">${icon('phone',10)} ${esc(f.phone)}${f.contactName ? ' · ' + esc(f.contactName) : ''}${f.contactTitle ? ' (' + esc(f.contactTitle) + ')' : ''}</div>` : ''}
        <div class="price-mono" style="font-size:12px;font-weight:700;color:#C97D4A;margin-top:2px;">نقد: ${fmtNum(p.priceCash)} تومان</div>
        ${p.priceCheck ? `<div class="price-mono" style="font-size:11px;font-weight:600;color:#8FB39A;">چک${p.checkMonths ? ' ' + esc(p.checkMonths) + ' ماهه' : ''}: ${fmtNum(p.priceCheck)} تومان</div>` : ''}
      </div>
    </button>`).join('');
}

function emptyState(iconName, title, desc) {
  return `<div class="empty"><div class="ic">${icon(iconName,26)}</div><div class="t">${title}</div><div class="d">${desc}</div></div>`;
}

function renderFactoriesListOnly() {
  const wrap = document.getElementById('factoriesListWrap');
  if (!wrap) return;
  const q = factoriesSearchQuery.trim().toLowerCase();
  const filtered = q
    ? factories.filter(f => (f.name || '').toLowerCase().includes(q) || (f.location || '').toLowerCase().includes(q))
    : factories;
  if (factories.length === 0) {
    wrap.innerHTML = emptyState('factory', 'هنوز کارخانه‌ای ثبت نشده', 'با دکمهٔ + یک کارخانه اضافه کن تا محصولاتش رو ثبت کنی.');
  } else if (filtered.length === 0) {
    wrap.innerHTML = emptyState('search', 'چیزی پیدا نشد', 'نام دیگه‌ای رو امتحان کن.');
  } else {
    wrap.innerHTML = filtered.map(f => {
      const count = products.filter(p => p.factoryId === f.id && p.active).length;
      return `
        <button class="card" data-action="openFactory" data-id="${f.id}">
          <div class="swatch" style="background:${swatchFor(f.name)}">${icon('factory',18,'rgba(255,255,255,0.9)')}</div>
          <div class="grow">
            <div class="title-sm">${esc(f.name)}</div>
            <div class="sub-sm">${icon('mapPin',11)} ${esc(f.location) || 'بدون آدرس'}</div>
            ${factoryRatingBadgeHTML(f) ? `<div style="margin-top:4px;">${factoryRatingBadgeHTML(f)}</div>` : ''}
          </div>
          <div class="badge price-mono">${count}</div>
          ${icon('chevronLeft',16,'#6f6558')}
        </button>`;
    }).join('');
  }
}

function restoreScrollIfNeeded(viewName, el) {
  if (scrollPositions[viewName] !== undefined) {
    const pos = scrollPositions[viewName];
    delete scrollPositions[viewName];
    requestAnimationFrame(() => { el.scrollTop = pos; });
  }
}

function openConfirmDeleteProduct(id) {

function deleteProductConfirmed() {
  if (!pendingDeleteProductId) return;
  const id = pendingDeleteProductId;
  db.collection(COL_PRODUCTS).doc(id).delete()
    .then(() => showToast('محصول حذف شد'))
    .catch(() => showToast('حذف ناموفق بود'));
  db.collection(COL_PRODUCT_PHOTOS).doc(id).delete().catch(() => {});
  closeModal();
}

let lightboxPhotos = [];
let lightboxIndex = 0;

function openLightbox(photos, idx) {
  lightboxPhotos = photos || [];
  lightboxIndex = idx || 0;
  if (!lightboxPhotos.length) return;
  renderLightbox();
}

function lightboxNext() {
  if (!lightboxPhotos.length) return;
  lightboxIndex = (lightboxIndex + 1) % lightboxPhotos.length;
  renderLightbox();
}

function lightboxPrev() {
  if (!lightboxPhotos.length) return;
  lightboxIndex = (lightboxIndex - 1 + lightboxPhotos.length) % lightboxPhotos.length;
  renderLightbox();
}

function renderLightbox() {
  const root = document.getElementById('lightboxRoot');
  root.style.display = 'block';
  const total = lightboxPhotos.length;
  root.innerHTML = `<div class="lightbox-overlay" data-action="closeLightbox">
    <button class="lightbox-close" data-action="closeLightbox">${icon('x',16,'#fff')}</button>
    <img src="${resolvePhotoSrc(lightboxPhotos[lightboxIndex])}" data-action="noop">
    ${total > 1 ? `
      <button class="lightbox-nav lightbox-prev" data-action="lightboxPrev">${icon('chevronRight',20,'#fff')}</button>
      <button class="lightbox-nav lightbox-next" data-action="lightboxNext">${icon('chevronLeft',20,'#fff')}</button>
      <div class="lightbox-counter">${lightboxIndex+1} / ${total}</div>
    ` : ''}
  </div>`;
  if (total > 1) {
    const overlay = root.querySelector('.lightbox-overlay');
    let startX = null;
    overlay.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
    overlay.addEventListener('touchend', (e) => {
      if (startX === null) return;
      const diff = e.changedTouches[0].clientX - startX;
      if (Math.abs(diff) > 40) { diff < 0 ? lightboxNext() : lightboxPrev(); }
      startX = null;
    }, { passive: true });
  }
}

function attachPhotoHandler(entryId) {
  const inputEl = document.getElementById('p_photo_input_' + entryId);
  if (!inputEl) return;
  inputEl.addEventListener('change', function photoChangeHandler(e) {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    const entry = productEntries.find(x => x.localId === entryId);
    if (!entry) return;
    let remaining = files.length;
    files.forEach(file => {
      handlePhotoFile(file, (dataUrl, thumbUrl) => {
        entry.photos.push(dataUrl);
        entry.photoThumbs.push(thumbUrl);
        remaining--;
        if (remaining === 0) {
          const row = document.getElementById('photoRow_' + entryId);
          if (row) row.outerHTML = photoRowHTML(entry);
          attachPhotoHandler(entryId);
        }
      });
    });
  });
}

    if (g('p_notes_' + id) !== undefined) entry.notes = g('p_notes_' + id);
    ['stoneType', 'color', 'pattern', 'process', 'sort'].forEach(f => {
      const customVal = g('p_custom_' + f + '_' + id);
      if (customVal) entry[f] = customVal;
    });

    if (customThickness) entry.thickness = customThickness;
    const customWidth = g('p_custom_width_' + id);
    if (customWidth) entry.width = customWidth;

      if (g('dim_width_input_' + id) !== undefined) entry.width = g('dim_width_input_' + id);

    if (entry.dimType === 'صراحی') {
      if (g('dim_spoutLength_' + id) !== undefined) entry.spoutLength = g('dim_spoutLength_' + id);
    }
  });

function submitEntries() {
  const isEdit = !!(productModalData && productModalData.editing);
  const g = (elId) => { const el = document.getElementById(elId); return el ? el.value : ''; };
  let savedCount = 0;
  productEntries.forEach((entry, idx) => {
    const id = entry.localId;
    const name = g('p_name_' + id).trim();
    const priceCashRaw = g('p_priceCash_' + id).replace(/\./g, '').trim();
    if (!name || priceCashRaw === '') return;
    const stoneType = g('p_custom_stoneType_' + id).trim() || entry.stoneType || '';
    const color = g('p_custom_color_' + id).trim() || entry.color || '';
    const pattern = g('p_custom_pattern_' + id).trim() || entry.pattern || '';
    const processType = g('p_custom_process_' + id).trim() || entry.process || '';
    const sort = g('p_custom_sort_' + id).trim() || entry.sort || '';
    let width = '', length = '', thickness = '', spoutLength = '', spoutShape = '';
    if (entry.dimType === 'تایل') {
      width = g('p_custom_width_' + id).trim() || entry.width || '';
      length = 'آزاد';
      thickness = g('p_custom_thickness_' + id).trim() || entry.thickness || '';
    } else if (entry.dimType === 'صراحی') {
      spoutLength = g('dim_spoutLength_' + id);
      spoutShape = entry.spoutShape || '';
    } else if (entry.dimType) {
      width = g('dim_width_input_' + id);
      length = g('dim_length_input_' + id);
      thickness = g('p_custom_thickness_' + id).trim() || entry.thickness || '';
    }
    const priceCheckRaw = g('p_priceCheck_' + id).replace(/\./g, '').trim();
    saveProductSingle({
      id: (isEdit && idx === 0) ? productModalData.editing.id : undefined,
      factoryId: productModalData.factoryId,
      name, stoneType, color, pattern, processType, sort,
      qadopa: g('p_qadopa_' + id).trim(),
      dimensionType: entry.dimType || '', width, length, thickness, spoutLength, spoutShape,
      unit: g('p_unit_' + id).trim() || 'م.م',
      priceCash: Number(priceCashRaw),
      priceCheck: priceCheckRaw !== '' ? Number(priceCheckRaw) : '',
      checkMonths: g('p_checkMonths_' + id).trim(),
      priceValidityDays: g('p_priceValidity_' + id).trim(),
      notes: g('p_notes_' + id).trim(),
      photos: entry.photos || [], photoThumbs: entry.photoThumbs || []
    });
    savedCount++;
  });
  if (savedCount === 0) { showToast('نام و قیمت نقد لازمه'); return; }
  closeModal();
  showToast(isEdit ? 'محصول به‌روزرسانی شد' : (savedCount > 1 ? savedCount + ' محصول ثبت شد' : 'محصول ثبت شد'));
}

// ---------- delegated click handling ----------
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const action = t.getAttribute('data-action');
  const id = t.getAttribute('data-id');
  const entryId = t.getAttribute('data-entry');
  switch (action) {
    case 'goHome': view = 'home'; searchQuery=''; render(); break;
    case 'goSearch': view = 'search'; render(); break;
    case 'goRecent': view = 'recent'; render(); break;
    case 'goFactories': view = 'factories'; render(); break;
    case 'openFactory': scrollPositions[view] = document.getElementById('bodyArea').scrollTop; activeFactoryId = id; view = 'factory'; showInactive = false; render(); break;
    case 'openFactoryFromSearch': if (id) { scrollPositions[view] = document.getElementById('bodyArea').scrollTop; activeFactoryId = id; view = 'factory'; searchQuery=''; showInactive = false; render(); } break;
    case 'openProductDetail': scrollPositions[view] = document.getElementById('bodyArea').scrollTop; activeProductId = id; productDetailFrom = view; view = 'productDetail'; render(); break;
    case 'goBackFromDetail': view = productDetailFrom || 'search'; render(); break;
    case 'openLightbox': {
      const prod = products.find(x => x.id === id);
      const idx = Number(t.getAttribute('data-idx') || 0);
      if (prod) {
        const photos = getProductPhotos(prod);
        if (photos.length) openLightbox(photos, idx);
        else { pendingLightboxRequest = { productId: id, idx }; showToast('در حال بارگذاری عکس...'); }
      }
      break;
    }
    case 'closeLightbox': closeLightbox(); break;
    case 'lightboxNext': lightboxNext(); break;
    case 'lightboxPrev': lightboxPrev(); break;
    case 'noop': break;
    case 'openEntryPhoto': {
      const entry = productEntries.find(en => en.localId === entryId);
      const idx = Number(t.getAttribute('data-idx') || 0);
      if (entry && entry.photos && entry.photos.length) openLightbox(entry.photos, idx);
      break;
    }
    case 'removePhoto': {
      const entry = productEntries.find(en => en.localId === entryId);
      const idx = Number(t.getAttribute('data-idx') || 0);
      if (entry) { entry.photos.splice(idx, 1); entry.photoThumbs.splice(idx, 1); }
      const row = document.getElementById('photoRow_' + entryId);
      if (row && entry) row.outerHTML = photoRowHTML(entry);
      attachPhotoHandler(entryId);
      break;
    }
    case 'editFactory': openFactoryModal(factories.find(f => f.id === activeFactoryId)); break;
    case 'toggleInactive': showInactive = !showInactive; renderBody(); break;
    case 'toggleActive': toggleActive(id); break;
    case 'confirmDeleteProduct': openConfirmDeleteProduct(id); break;
    case 'deleteProductConfirmed': deleteProductConfirmed(); break;
    case 'doLogin': doLogin(); break;
    case 'editProduct': openProductModal(activeFactoryId, products.find(p => p.id === id)); break;
    case 'showHistory': openHistoryModal(products.find(p => p.id === id)); break;
    case 'openAdd': view === 'factory' ? openProductModal(activeFactoryId, null) : openFactoryModal({}); break;
    case 'closeModal': closeModal(); break;
    case 'closeModalBg': if (t === e.target) closeModal(); break;
    case 'submitFactory': submitFactory(); break;
    case 'submitEntries': submitEntries(); break;
    case 'addEntry': {
      syncEntriesFromDOM();
      const last = productEntries[productEntries.length - 1];
      productEntries.push(newEntryState(last));
      renderProductEntriesModal();
      break;
    }
    case 'removeEntry': {
      syncEntriesFromDOM();
      productEntries = productEntries.filter(en => en.localId !== entryId);
      if (!productEntries.length) productEntries = [newEntryState()];
      renderProductEntriesModal();
      break;
    }
    case 'voiceStone': startVoice('p_custom_stoneType_' + entryId); break;
    case 'setSort': sortMode = t.getAttribute('data-sort'); renderBody(); break;
    case 'togglePriceFilter': showPriceFilter = !showPriceFilter; renderBody(); break;
    case 'toggleAttrFilter': showAttrFilter = !showAttrFilter; renderBody(); break;
    case 'toggleFactoryMode': searchModeFactory = !searchModeFactory; renderBody(); break;
    case 'selectChip': {
      const field = t.getAttribute('data-field');
      const value = t.getAttribute('data-value');
      const entry = productEntries.find(en => en.localId === entryId);
      if (entry) entry[field] = value;
      document.getElementById(field + 'Chips_' + entryId).querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      t.classList.add('selected');
      const customInput = document.getElementById('p_custom_' + field + '_' + entryId);
      if (customInput) customInput.value = '';
      break;
    }
    case 'selectDimType': {
      const value = t.getAttribute('data-value');
      const entry = productEntries.find(en => en.localId === entryId);
      if (entry) { entry.dimType = value; entry.width = ''; entry.length = ''; entry.thickness = ''; entry.spoutLength = ''; entry.spoutShape = ''; }
      document.getElementById('dimTypeChips_' + entryId).querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      t.classList.add('selected');
      renderDimDetail(entryId, value, {});
      break;
    }
    case 'selectSpoutShape': {
      const value = t.getAttribute('data-value');
      const entry = productEntries.find(en => en.localId === entryId);
      if (entry) entry.spoutShape = value;
      document.getElementById('spoutShapeChips_' + entryId).querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      t.classList.add('selected');
      break;
    }
  }
});

// ---------- init ----------
initFirebase();
setupExitGuard();
loadData(); // login gate (initAuth) intentionally not enabled yet — see /* AUTH GATE */ below
</script>
</body>
</html>
